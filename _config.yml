# Hohe Tour – unterwegs zwischen Böhmen und Sachsen
# Jekyll-Konfiguration (Theme: Minimal Mistakes, Sprache: Deutsch)

title: Hohe Tour
subtitle: unterwegs zwischen Böhmen und Sachsen
email: hohetour@wbrief.de
description: >-
  Die Hohe Tour zwischen Zinnwald und Schöna: Skitour im Winter,
  Rad- und Wandertouren im Sommer – Routen, Berichte und Tipps
  für die Grenzregion zwischen Böhmen und Sachsen.
baseurl: ""
url: "https://hohetour.de"
repository: Kugeleis/hohetour
locale: "de-DE"

author:
  name: webonkel
  email: hohetour@wbrief.de
  bio: "Unterwegs zwischen Böhmen und Sachsen – Ski, Rad und Wanderschuh."
  links:
    - label: Website
      icon: fas fa-link
      url: "https://hohetour.de"

# Build settings
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "sunrise"
markdown: kramdown
highlighter: rouge
timezone: Europe/Berlin
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      toc: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      toc: true
      share: true

category_archive:
  type: liquid
  path: /kategorien/
tag_archive:
  type: liquid
  path: /schlagworte/

# Keine Paginierung: jekyll-paginate braucht index.html, wir nutzen index.markdown
# (Minimal Mistakes listet auf der Startseite ohnehin alle Posts).


sitemap:
  exclude:
    - /assets/
    - /404.html

# Ausgeschlossen: WP-Export, Konverter-Skripte, Build-Artefakte
exclude:
  - hohetour.WordPress.2026-09-20.xml
  - tools/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - Taskfile.yml
  - README.md

